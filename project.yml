# XcodeGen 設定ファイル
# 使い方:
#   $ brew install xcodegen
#   $ xcodegen generate
# これで GPSLogger.xcodeproj が再生成される。

name: GPSLogger
options:
  bundleIdPrefix: com.junhnam
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Swift Package 依存（S1-002）
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    # Sprint 1 時点での最新安定版に追随。後続スプリントでバージョン固定の検討予定。
    from: "9.0.0"

targets:
  GPSLogger:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GPSLogger
        excludes:
          - "Resources/Info.plist"
          - "Resources/GoogleMaps-Info.plist.example"
          - "Design/**"
    # GoogleMaps-Info.plist は .gitignore で除外されており、jun さん側で配置すると
    # XcodeGen が自動的にバンドルに含めます（File System Synchronized Groups）。
    # 未配置でもビルドは通り、起動時に警告ログが出るのみ。
    info:
      path: GPSLogger/Resources/Info.plist
      properties:
        CFBundleDisplayName: GPSログ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 位置情報の権限説明（S1-003）
        # When-In-Use: アプリ使用中のみ（最初のダイアログで提示される簡易版）
        NSLocationWhenInUseUsageDescription: "移動経路を地図上に記録するため、位置情報を利用します。"
        # Always: バックグラウンドでも継続記録するために必要
        NSLocationAlwaysAndWhenInUseUsageDescription: "移動経路を地図上に記録するため、位置情報を利用します。アプリを閉じていても記録するため、常に許可を選んでください。正確な位置情報を有効にすると経路の精度が向上します。"
        # カレンダー（フルアクセス）の権限説明（S4-002 / iOS 17+ の新キー）
        NSCalendarsFullAccessUsageDescription: "滞留地点を自動的にカレンダーに記録するために使用します。"
        # バックグラウンド実行モード（S1-003）
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junhnam.gpslogger
        PRODUCT_NAME: GPSLogger
        TARGETED_DEVICE_FAMILY: "1"  # iPhone のみ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps

  GPSLoggerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GPSLoggerTests
    dependencies:
      - target: GPSLogger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junhnam.gpslogger.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GPSLogger:
    build:
      targets:
        GPSLogger: all
        GPSLoggerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GPSLoggerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
